name: Spec Minimal CI

on:
  pull_request:
    paths:
      - "src/specs/**"
  push:
    branches:
      - "**"
    paths:
      - "src/specs/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-runtime-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      CONTRACTGUARD_RUNTIME_MAPPING_JSON: ${{ secrets.CONTRACTGUARD_RUNTIME_MAPPING_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt

      - name: Build IR from specs
        run: |
          mkdir -p build/ir
          python src/extract_ir.py src/specs --pretty -o build/ir

      - name: Generate tests from IR
        run: |
          mkdir -p build/tests
          python src/generate_tests.py build/ir --pretty -o build/tests

      - name: Prepare runtime tests with mapping injection
        run: |
          mkdir -p build/runtime-tests build/results
          python src/test_runner/prepare_runtime_tests.py build/tests \
            --output-dir build/runtime-tests \
            --mapping config/runtime_mapping.json \
            --skip-report build/results/runtime-skip-report.json

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-pipeline-build
          path: |
            build/ir
            build/tests
            build/runtime-tests
            build/results
          if-no-files-found: ignore

  discover-suites:
    runs-on: ubuntu-latest
    needs: build-runtime-tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      suite_count: ${{ steps.matrix.outputs.suite_count }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spec-pipeline-build
          path: .

      - name: Build suite matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          candidate_dirs = [
            Path("build/runtime-tests"),
            Path("runtime-tests"),
            Path("build/tests"),
          ]

          suite_dir = None
          files = []
          for candidate in candidate_dirs:
            if candidate.exists():
              candidate_files = sorted(candidate.rglob("*.json"))
              if candidate_files:
                suite_dir = candidate
                files = candidate_files
                break

          # Last-resort fallback: find any json under a runtime-tests folder.
          if not files:
            files = sorted(
              p for p in Path(".").rglob("*.json")
              if "/runtime-tests/" in p.as_posix()
            )
            if files:
              suite_dir = None

          if suite_dir is not None:
            print(f"Suite discovery root: {suite_dir}")
          else:
            print("Suite discovery root: <fallback scan>")

          include = [
              {
                  "suite_file": str(p).replace("\\\\", "/"),
              "suite_name": (
                str(p.relative_to(suite_dir)).replace("/", "__").replace(".json", "")
                if suite_dir is not None
                else p.stem
              ),
              }
              for p in files
          ]
          matrix = {"include": include}

          print(f"Discovered suite files: {len(include)}")
          for item in include[:50]:
              print(" -", item["suite_file"])

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"suite_count={len(include)}\\n")
              f.write(f"matrix={json.dumps(matrix)}\\n")
          PY

  run-suite-tests:
    runs-on: ubuntu-latest
    needs: discover-suites
    if: ${{ needs.discover-suites.outputs.suite_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-suites.outputs.matrix || '{"include":[]}') }}
    env:
      PYTHONPATH: src
      CONTRACTGUARD_AUTH_BY_BASE_URL_JSON: ${{ secrets.CONTRACTGUARD_AUTH_BY_BASE_URL_JSON }}
      CONTRACTGUARD_BEARER_TOKEN: ${{ secrets.CONTRACTGUARD_BEARER_TOKEN }}
      CONTRACTGUARD_API_KEY: ${{ secrets.CONTRACTGUARD_API_KEY }}
      CONTRACTGUARD_API_KEY_HEADER: ${{ secrets.CONTRACTGUARD_API_KEY_HEADER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spec-pipeline-build
          path: .

      - name: Resolve suite auth by base URL
        shell: bash
        env:
          SUITE_FILE: ${{ matrix.suite_file }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          suite_file = Path(os.environ["SUITE_FILE"])
          suite = json.loads(suite_file.read_text(encoding="utf-8"))
          base_url = str(suite.get("base_url") or "").strip()

          # Default to global credentials.
          resolved = {
              "bearer_token": os.environ.get("CONTRACTGUARD_BEARER_TOKEN", ""),
              "api_key": os.environ.get("CONTRACTGUARD_API_KEY", ""),
              "api_key_header": os.environ.get("CONTRACTGUARD_API_KEY_HEADER", ""),
          }

          # Override from per-base-url mapping secret when provided.
          raw_mapping = os.environ.get("CONTRACTGUARD_AUTH_BY_BASE_URL_JSON", "")
          if raw_mapping.strip() and base_url:
              try:
                  mapping = json.loads(raw_mapping)
              except Exception:
                  mapping = {}
              if isinstance(mapping, dict):
                  entry = mapping.get(base_url)
                  if isinstance(entry, dict):
                      resolved["bearer_token"] = str(entry.get("bearer_token") or "")
                      resolved["api_key"] = str(entry.get("api_key") or "")
                      resolved["api_key_header"] = str(entry.get("api_key_header") or "")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"SUITE_BASE_URL={base_url}\\n")
              f.write(f"CONTRACTGUARD_BEARER_TOKEN={resolved['bearer_token']}\\n")
              f.write(f"CONTRACTGUARD_API_KEY={resolved['api_key']}\\n")
              f.write(f"CONTRACTGUARD_API_KEY_HEADER={resolved['api_key_header']}\\n")
          PY

      - name: Run suite tests
        id: run-suite
        continue-on-error: true
        shell: bash
        env:
          SUITE_FILE: ${{ matrix.suite_file }}
          SUITE_NAME: ${{ matrix.suite_name }}
        run: |
          mkdir -p build/results
          python src/test_runner/run_test.py "$SUITE_FILE" \
            --base-url "$SUITE_BASE_URL" \
            --timeout 12 \
            --json-output "build/results/${SUITE_NAME}.json"

      - name: Upload suite result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-result-${{ matrix.suite_name }}
          path: build/results/${{ matrix.suite_name }}.json
          if-no-files-found: ignore

      - name: Mark job failed when suite failed
        if: ${{ steps.run-suite.outcome != 'success' }}
        run: exit 1

  summarize-and-comment:
    runs-on: ubuntu-latest
    needs:
      - build-runtime-tests
      - run-suite-tests
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download suite result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: suite-result-*
          merge-multiple: true
          path: build/results

      - name: Build failure summary
        id: summary
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          result_dir = Path("build/results")
          result_dir.mkdir(parents=True, exist_ok=True)
          files = sorted(result_dir.glob("*.json"))

          total = passed = failed = skipped = 0
          failed_cases = []

          for p in files:
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              summary = data.get("summary") or {}
              suites = data.get("suites") or []

              total += int(summary.get("total", 0))
              passed += int(summary.get("passed", 0))
              failed += int(summary.get("failed", 0))
              skipped += int(summary.get("skipped", 0))

              for suite in suites:
                  api_title = suite.get("api_title", p.stem)
                  for row in suite.get("results", []):
                      if row.get("outcome") != "FAIL":
                          continue
                      failed_cases.append(
                          {
                              "api_title": api_title,
                              "test_id": row.get("test_id"),
                              "method": row.get("method"),
                              "path": row.get("path"),
                              "expected": row.get("expected_status_any_of") or row.get("expected_status"),
                              "actual": row.get("actual_status"),
                              "snippet": (row.get("response_snippet") or "")[:200],
                          }
                      )

          has_failed = "true" if failed > 0 else "false"
          summary_lines = [
              "<!-- contractguard-failure-summary -->",
              "## ContractGuard CI Summary",
              f"- Total: {total}",
              f"- Passed: {passed}",
              f"- Failed: {failed}",
              f"- Skipped: {skipped}",
              "",
          ]

          if failed_cases:
              summary_lines.append("### Top Failed Cases")
              for item in failed_cases[:20]:
                  summary_lines.append(
                      f"- [{item['api_title']}] {item['test_id']} | {item['method']} {item['path']} | expected={item['expected']} got={item['actual']}"
                  )
              summary_lines.append("")
              summary_lines.append("### LLM Failure Analysis (Skeleton)")
              summary_lines.append("- Hook point ready: feed the failed cases above into your LLM pipeline.")
              summary_lines.append("- Suggested input: build/results/*.json and build/runtime-tests/*.json artifacts.")
              summary_lines.append("- Suggested output: grouped root causes + concrete fix actions per group.")
          elif not files:
              summary_lines.append("### No Suite Result Artifacts")
              summary_lines.append("- No suite-result-*.json files were downloaded in this job.")
              summary_lines.append("- This usually means run-suite-tests was skipped, or all suite jobs failed before writing JSON output.")

          Path("build/results/failure-summary.md").write_text("\n".join(summary_lines), encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"has_failed={has_failed}\\n")
          PY

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-pipeline-summary
          path: build/results/failure-summary.md
          if-no-files-found: ignore

      - name: Comment summary on pull request
        if: ${{ github.event_name == 'pull_request' && steps.summary.outputs.has_failed == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- contractguard-failure-summary -->';
            const body = fs.readFileSync('build/results/failure-summary.md', 'utf8');
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
