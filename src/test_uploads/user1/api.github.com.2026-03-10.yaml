openapi: 3.0.3

info:
  title: GitHub v3 REST API - Minimal Subset
  version: 1.0.0
  description: Minimal 3-endpoint subset for auth and basic contract testing.

servers:
  - url: https://api.github.com

tags:
  - name: users
  - name: rate-limit
  - name: repos

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  parameters:
    owner:
      name: owner
      in: path
      required: true
      description: The account owner of the repository.
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      description: The name of the repository without the .git extension.
      schema:
        type: string

  schemas:
    BasicError:
      type: object
      properties:
        message:
          type: string
        documentation_url:
          type: string
      required:
        - message

    User:
      type: object
      properties:
        login:
          type: string
        id:
          type: integer
        node_id:
          type: string
        avatar_url:
          type: string
        html_url:
          type: string
        type:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
      required:
        - login
        - id
        - node_id
        - avatar_url
        - html_url
        - type

    RateLimit:
      type: object
      properties:
        limit:
          type: integer
        remaining:
          type: integer
        reset:
          type: integer
        used:
          type: integer
      required:
        - limit
        - remaining
        - reset
        - used

    RateLimitOverview:
      type: object
      properties:
        resources:
          type: object
          properties:
            core:
              $ref: '#/components/schemas/RateLimit'
            search:
              $ref: '#/components/schemas/RateLimit'
            graphql:
              $ref: '#/components/schemas/RateLimit'
            integration_manifest:
              $ref: '#/components/schemas/RateLimit'
            code_search:
              $ref: '#/components/schemas/RateLimit'
        rate:
          $ref: '#/components/schemas/RateLimit'
      required:
        - resources
        - rate

    Repository:
      type: object
      properties:
        id:
          type: integer
        node_id:
          type: string
        name:
          type: string
        full_name:
          type: string
        private:
          type: boolean
        owner:
          type: object
          properties:
            login:
              type: string
            id:
              type: integer
          required:
            - login
            - id
        html_url:
          type: string
        description:
          type: string
          nullable: true
        fork:
          type: boolean
        url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pushed_at:
          type: string
          format: date-time
        homepage:
          type: string
          nullable: true
        size:
          type: integer
        stargazers_count:
          type: integer
        watchers_count:
          type: integer
        language:
          type: string
          nullable: true
        forks_count:
          type: integer
        open_issues_count:
          type: integer
        default_branch:
          type: string
      required:
        - id
        - node_id
        - name
        - full_name
        - private
        - owner
        - html_url
        - fork
        - url
        - created_at
        - updated_at
        - pushed_at
        - size
        - stargazers_count
        - watchers_count
        - forks_count
        - open_issues_count
        - default_branch

  responses:
    Unauthorized:
      description: Requires authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicError'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicError'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasicError'

    MovedPermanently:
      description: Moved permanently

paths:
  /user:
    get:
      tags:
        - users
      summary: Get the authenticated user
      operationId: users/get-authenticated
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rate_limit:
    get:
      tags:
        - rate-limit
      summary: Get rate limit status for the authenticated user
      operationId: rate-limit/get
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rate limit overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitOverview'
        '404':
          $ref: '#/components/responses/NotFound'

  /repos/{owner}/{repo}:
    get:
      tags:
        - repos
      summary: Get a repository
      operationId: repos/get
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      responses:
        '200':
          description: Repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '301':
          $ref: '#/components/responses/MovedPermanently'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'