models:
  - qwen3-coder:latest

specs:
  - src/test_uploads/user1/api.github.com.2026-03-10.yaml

output_dir: build/llm_runs

case_scope: fail

llm:
  timeout_seconds: 150
  output_word_target: 55
  output_word_max: 100
  retry_invalid_output: 1
  max_cases_per_spec: 5

evidence:
  max_items_per_section: 12
  snippet_chars: 300
  max_similar_failures: 5

ollama:
  base_url: http://localhost:11434
  options: {}

runner:
  timeout_seconds: 12

auth_by_base_url:
  api.github.com:
    type: bearer
    value: env:CONTRACTGUARD_BEARER_TOKEN
