services:
  db:
    image: postgres:16-alpine
    container_name: contractguard-db
    environment:
      POSTGRES_USER: contractguard
      POSTGRES_PASSWORD: contractguard
      POSTGRES_DB: contractguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractguard -d contractguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: contractguard-backend
    environment:
      DATABASE_URL: postgresql+psycopg://contractguard:contractguard@db:5432/contractguard
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRE_MINUTES: "60"
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: contractguard-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
